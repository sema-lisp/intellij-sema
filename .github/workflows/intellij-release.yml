# Sign and publish the Sema IntelliJ plugin to the JetBrains Marketplace.
#
# Runs on a `v*` tag push. The plugin is already approved on the Marketplace, so an
# update is a routine publish rather than a first submission that needs review — the
# tag is the reviewed action. `workflow_dispatch` is kept for a dry run and for
# re-publishing without moving a tag. This workflow creates no tags and no GitHub
# Releases.
#
# The tag must match `pluginVersion` in gradle.properties: gradle.properties is the
# source of truth (it also selects the Marketplace channel — a pre-release suffix
# publishes to `beta`), and the guard below fails the run on a mismatch rather than
# publishing a version nobody committed.
#
# Requires four repository secrets: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD,
# CERTIFICATE_CHAIN. See RELEASING.md and
# https://plugins.jetbrains.com/docs/intellij/plugin-signing.html

name: IntelliJ Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sign and upload the ZIP as an artifact only (do not publish to Marketplace)'
        type: boolean
        default: false

jobs:
  release:
    name: Publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check the tag matches pluginVersion
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '[:space:]')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version '${tag}' but gradle.properties has pluginVersion '${declared}'. Bump gradle.properties and re-tag."
            exit 1
          fi
          echo "publishing ${declared}"

      - name: Sign plugin (dry run)
        if: ${{ inputs.dry_run }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Publish plugin
        if: ${{ !inputs.dry_run }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload signed artifact
        uses: actions/upload-artifact@v5
        with:
          name: signed-plugin-distribution
          path: build/distributions/*-signed.zip
